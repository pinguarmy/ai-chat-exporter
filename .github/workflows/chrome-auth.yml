name: Check Chrome publishing authorization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check access without uploading or publishing
        env:
          PLASMO_CHROME_ID: ${{ secrets.PLASMO_CHROME_ID }}
          PLASMO_CHROME_CLIENT_ID: ${{ secrets.PLASMO_CHROME_CLIENT_ID }}
          PLASMO_CHROME_CLIENT_SECRET: ${{ secrets.PLASMO_CHROME_CLIENT_SECRET }}
          PLASMO_CHROME_REFRESH_TOKEN: ${{ secrets.PLASMO_CHROME_REFRESH_TOKEN }}
        run: node scripts/publish-cws.mjs --check-auth
