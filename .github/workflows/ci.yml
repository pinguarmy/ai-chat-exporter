name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Independent checks run as parallel jobs. Every check from the former single
# job still runs; `verify` aggregates them under the original check name so a
# required status check keeps working. Docs-only changes are not skipped: the
# contract tests under tests/tooling read docs, workflows and scripts.
jobs:
  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up project
        uses: ./.github/actions/setup-project

      # The coverage run executes the whole suite once and enforces thresholds.
      - name: Run tests with core coverage gate
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  static:
    name: Typecheck, lint, services, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Run lint
        run: npm run lint

      - name: Run feedback service tests
        run: npm run test:services

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  package:
    name: Build, Firefox lint, browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Build browser packages
        run: npm run build

      - name: Lint Firefox package
        run: npm run lint:firefox

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # No-op on a cache hit; downloads the browser on a miss.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # install-deps also installs the CJK, Thai and emoji fonts Chromium needs to
      # rasterize the multilingual PDF corpus; a library-only check misses them
      # (fonts are not shared-library dependencies). It runs apt-get update, so
      # the Poppler install below reuses those package lists.
      - name: Install browser system dependencies and fonts
        run: sudo npx playwright install-deps chromium

      - name: Install Poppler for PDF checks
        # No recommends: the PDF regression asserts Chinese renders without poppler-data.
        run: |
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi

      # The four scripts use separate temp profiles and download directories.
      - name: Run extension browser smoke
        run: npm run test:browser:parallel

  verify:
    name: Test, lint, and build
    if: always()
    needs: [unit, static, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              exit 1
            fi
          done
