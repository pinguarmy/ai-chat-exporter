name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run core coverage gate
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

      - name: Run lint
        run: npm run lint

      - name: Run feedback service tests
        run: npm run test:services

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build browser packages
        run: npm run build

      - name: Lint Firefox package
        run: npm run lint:firefox

      - name: Install Poppler for PDF checks
        # No recommends: the PDF regression asserts Chinese renders without poppler-data.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run extension browser smoke
        run: npm run test:browser
