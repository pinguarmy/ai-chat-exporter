name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Serialize releases so manual and tag-triggered runs cannot publish concurrently.
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      PLASMO_CHROME_ID: ${{ secrets.PLASMO_CHROME_ID }}
      PLASMO_CHROME_CLIENT_ID: ${{ secrets.PLASMO_CHROME_CLIENT_ID }}
      PLASMO_CHROME_CLIENT_SECRET: ${{ secrets.PLASMO_CHROME_CLIENT_SECRET }}
      PLASMO_CHROME_REFRESH_TOKEN: ${{ secrets.PLASMO_CHROME_REFRESH_TOKEN }}
      PLASMO_FIREFOX_ISSUER: ${{ secrets.PLASMO_FIREFOX_ISSUER }}
      PLASMO_FIREFOX_SECRET: ${{ secrets.PLASMO_FIREFOX_SECRET }}
      PLASMO_EDGE_CLIENT_ID: ${{ secrets.PLASMO_EDGE_CLIENT_ID }}
      PLASMO_EDGE_API_KEY: ${{ secrets.PLASMO_EDGE_API_KEY }}
      PLASMO_EDGE_PRODUCT_ID: ${{ secrets.PLASMO_EDGE_PRODUCT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and validate release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${VERSION}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${EXPECTED_TAG}." >&2
              exit 1
            fi
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${EXPECTED_TAG}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
              if [[ "$(git rev-list -n 1 "${TAG}")" != "$(git rev-parse HEAD)" ]]; then
                echo "Existing tag ${TAG} points to a different commit." >&2
                exit 1
              fi
            fi
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build browser and source packages
        run: npm run build

      - name: Create manual release tag after validation
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if [[ "$(git rev-list -n 1 "${TAG}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag ${TAG} was created at a different commit during validation." >&2
              exit 1
            fi
            echo "Tag ${TAG} already exists at the validated commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create release notes
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "## AI Chat Exporter ${VERSION}"
            echo
            cat <<'EOF'
          This release consolidates provider parsing, export reliability, scheduled Markdown export, and the refreshed popup/options experience for ChatGPT, Gemini, Claude, DeepSeek, and Grok.

          ### Highlights
          - Shared parser runtime with API/DOM completeness fallback, rate-limit handling, and provider-specific overrides.
          - More reliable Markdown/PDF export for attachments, artifacts, inline media, filenames, and searchable PDF text.
          - Optional scheduled Markdown export with bounded concurrency, cancellation, retry state, and provider status.
          - Shared export options and theme/UI components across popup, options, and preview pages.
          - Firefox packaging now uses an isolated manifest staging directory; Chrome, Firefox, and source archives are independently verified.

          ### Files
          - `ai-chat-exporter.zip` — Chrome Web Store / Microsoft Edge Add-ons package
          - `ai-chat-exporter-firefox.zip` — Firefox Add-ons package
          - `ai-chat-exporter-source.zip` — source archive for Firefox AMO source review (not installable)

          ### Validation
          - `npm test` — full Vitest suite
          - `npm run lint` — TypeScript check
          - `npm audit --omit=dev` — no production vulnerabilities
          - `npm run build` — Chrome, Firefox, unpacked mirror, ZIP integrity, and source archive checks
          EOF
          } > RELEASE_NOTES.md

      - name: Publish to Chrome Web Store
        if: ${{ env.PLASMO_CHROME_ID != '' && env.PLASMO_CHROME_CLIENT_ID != '' && env.PLASMO_CHROME_CLIENT_SECRET != '' && env.PLASMO_CHROME_REFRESH_TOKEN != '' }}
        run: node scripts/publish-cws.mjs

      - name: Publish to Firefox AMO
        if: ${{ env.PLASMO_FIREFOX_ISSUER != '' && env.PLASMO_FIREFOX_SECRET != '' }}
        run: node scripts/publish-firefox.mjs

      - name: Publish to Microsoft Edge Add-ons
        if: ${{ env.PLASMO_EDGE_CLIENT_ID != '' && env.PLASMO_EDGE_API_KEY != '' && env.PLASMO_EDGE_PRODUCT_ID != '' }}
        run: node scripts/publish-edge.mjs

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" ai-chat-exporter.zip ai-chat-exporter-firefox.zip ai-chat-exporter-source.zip --clobber
          else
            gh release create "${TAG}" ai-chat-exporter.zip ai-chat-exporter-firefox.zip ai-chat-exporter-source.zip \
              --title "AI Chat Exporter ${TAG}" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ai-chat-exporter-release-packages
          path: |
            ai-chat-exporter.zip
            ai-chat-exporter-firefox.zip
            ai-chat-exporter-source.zip
          if-no-files-found: error
