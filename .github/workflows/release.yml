name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Serialize releases so manual and tag-triggered runs cannot publish concurrently.
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      PLASMO_CHROME_ID: ${{ secrets.PLASMO_CHROME_ID }}
      PLASMO_CHROME_CLIENT_ID: ${{ secrets.PLASMO_CHROME_CLIENT_ID }}
      PLASMO_CHROME_CLIENT_SECRET: ${{ secrets.PLASMO_CHROME_CLIENT_SECRET }}
      PLASMO_CHROME_REFRESH_TOKEN: ${{ secrets.PLASMO_CHROME_REFRESH_TOKEN }}
      PLASMO_FIREFOX_ISSUER: ${{ secrets.PLASMO_FIREFOX_ISSUER }}
      PLASMO_FIREFOX_SECRET: ${{ secrets.PLASMO_FIREFOX_SECRET }}
      PLASMO_EDGE_CLIENT_ID: ${{ secrets.PLASMO_EDGE_CLIENT_ID }}
      PLASMO_EDGE_API_KEY: ${{ secrets.PLASMO_EDGE_API_KEY }}
      PLASMO_EDGE_PRODUCT_ID: ${{ secrets.PLASMO_EDGE_PRODUCT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and validate release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${VERSION}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${EXPECTED_TAG}." >&2
              exit 1
            fi
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${EXPECTED_TAG}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
              if [[ "$(git rev-list -n 1 "${TAG}")" != "$(git rev-parse HEAD)" ]]; then
                echo "Existing tag ${TAG} points to a different commit." >&2
                exit 1
              fi
            fi
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check publishing configuration before build
        run: node scripts/check-publishing-config.mjs

      - name: Run tests
        run: npm test

      - name: Run core coverage gate
        run: npm run test:coverage

      - name: Run lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build browser and source packages
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run extension browser smoke
        run: npm run test:browser

      - name: Create manual release tag after validation
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if [[ "$(git rev-list -n 1 "${TAG}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag ${TAG} was created at a different commit during validation." >&2
              exit 1
            fi
            echo "Tag ${TAG} already exists at the validated commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create release notes
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NOTES_FILE="docs/releases/${VERSION}.md"
          if [[ ! -s "${NOTES_FILE}" ]]; then
            echo "Missing release notes: ${NOTES_FILE}" >&2
            exit 1
          fi
          cp "${NOTES_FILE}" RELEASE_NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Preserve its assets; use the documented single-platform recovery path." >&2
            exit 1
          else
            gh release create "${TAG}" ai-chat-exporter.zip ai-chat-exporter-firefox.zip ai-chat-exporter-source.zip \
              --title "AI Chat Exporter ${TAG}" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ai-chat-exporter-release-packages
          path: |
            ai-chat-exporter.zip
            ai-chat-exporter-firefox.zip
            ai-chat-exporter-source.zip
          if-no-files-found: error

      # Run every store independently after the original packages are preserved.
      - name: Publish to Chrome Web Store
        id: chrome
        continue-on-error: true
        run: node scripts/publish-cws.mjs

      - name: Publish to Firefox AMO
        id: firefox
        continue-on-error: true
        run: node scripts/publish-firefox.mjs

      - name: Publish to Microsoft Edge Add-ons
        id: edge
        continue-on-error: true
        run: node scripts/publish-edge.mjs

      - name: Summarize store submissions
        if: always()
        env:
          CHROME_OUTCOME: ${{ steps.chrome.outcome }}
          FIREFOX_OUTCOME: ${{ steps.firefox.outcome }}
          EDGE_OUTCOME: ${{ steps.edge.outcome }}
        shell: bash
        run: |
          {
            echo '## Store submission results'
            echo '| Store | Step outcome |'
            echo '| --- | --- |'
            echo "| Chrome | ${CHROME_OUTCOME:-not-run} |"
            echo "| Firefox | ${FIREFOX_OUTCOME:-not-run} |"
            echo "| Edge | ${EDGE_OUTCOME:-not-run} |"
            echo 'A successful step is a submission receipt, not proof of public availability. Never rerun successful stores to recover another store.'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$CHROME_OUTCOME" == 'success' && "$FIREFOX_OUTCOME" == 'success' && "$EDGE_OUTCOME" == 'success' ]]
