name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Serialize releases so manual and tag-triggered runs cannot publish concurrently.
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and validate release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${VERSION}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${EXPECTED_TAG}." >&2
              exit 1
            fi
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${EXPECTED_TAG}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
              if [[ "$(git rev-list -n 1 "${TAG}")" != "$(git rev-parse HEAD)" ]]; then
                echo "Existing tag ${TAG} points to a different commit." >&2
                exit 1
              fi
            fi
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build browser packages
        run: npm run build

      - name: Create manual release tag after validation
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if [[ "$(git rev-list -n 1 "${TAG}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag ${TAG} was created at a different commit during validation." >&2
              exit 1
            fi
            echo "Tag ${TAG} already exists at the validated commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## AI Chat Exporter

          Browser extension packages for Chrome/Edge and Firefox.

          ### Files
          - `ai-chat-exporter.zip` — Chrome Web Store / Microsoft Edge Add-ons package
          - `ai-chat-exporter-firefox.zip` — Firefox Add-ons package

          ### Validation
          - Dependencies, tests, and lint run before release packaging.
          - Packages are generated with `npm run build`.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" ai-chat-exporter.zip ai-chat-exporter-firefox.zip --clobber
          else
            gh release create "${TAG}" ai-chat-exporter.zip ai-chat-exporter-firefox.zip \
              --title "AI Chat Exporter ${TAG}" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-exporter-release-packages
          path: |
            ai-chat-exporter.zip
            ai-chat-exporter-firefox.zip
          if-no-files-found: error
